<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Keywords" content="Loja geek, figures, Shadow Realm Store">
    <meta name="author" content="Shadow Realm">
    <title>Shadow Realm Store - Cadastro do Administrador</title>
    <link rel="stylesheet" href="site.css">
    <script src="site.js"></script>
    <script src="admin.js" defer></script>
    <link rel="stylesheet" href="melhorias.css">
    <script src="modais-globais.js"></script>
    <script src="favoritos.js" defer></script>
    <script src="extras-loja.js" defer></script>
</head>

<body>
    <header id="topo">
        <a href="index.html"><img src="imagens/logo.png" class="logo" alt="Logo Shadow Realm Store"></a>
        <h1>- Shadow Realm Store -</h1>
        <div class="nav">
            <nav>
                <a href="index.html" class="link"><img src="imagens/Casinha-removebg-preview.png" alt="Início"></a>
                <a href="produtos.html" class="link"><img src="imagens/produto.png" alt="Produtos"></a>
                <a href="contato.html" class="link"><img src="imagens/contato.png" alt="Contato"></a>
                <a href="carrinho.html" class="link"><img src="imagens/carrinho-removebg-preview.png" alt="Carrinho"></a>
                <button type="button" class="botaoUsuario" onclick="abreModalCliente()" aria-label="Menu do usuário"><img
                        src="imagens/Usuario.png" alt="Usuário"></button>
            </nav>
        </div>
    </header>

    <div class="modalCliente" id="modalCliente">
        <div class="modalCliente-conteudo">
            <h2>- Menu do usuário -</h2>
            <nav class="nav-usuario">
                <a href="cadastro.html">Cadastro</a>
                <a href="cliente.html">Login</a>
                <a href="cadastrocartao.html">Cadastrar cartão</a>
                <a href="pedidos.html">Meus Pedidos</a>
            </nav>
            <button type="button" onclick="fechaModalCliente()" class="botaoFecharCliente">Fechar</button>
        </div>
    </div>

    <h2 style="font-size: 35px; margin: 20px;">Cadastro do Administrador</h2>

    <form name="frmCadastroAdmin" method="post" class="formLogin"
        action="#" onsubmit="event.preventDefault(); validaCadastroAdmin();">

        <fieldset class="login">

            <div class="colunas">

                <label for="nomeAdmin">Nome Completo:</label>
                <input type="text" name="txtnome" id="nomeAdmin"
                    placeholder="Digite seu Nome Completo:" autocomplete="name" required>

                <label for="emailAdmin">Email:</label>
                <input type="email" name="txtemail" id="emailAdmin"
                    placeholder="Digite seu email:" autocomplete="email" required>

            </div>

            <div class="colunas">

                <label for="senhaAdmin">Senha:</label>

                <div style="position: relative; display: inline-block; width: 100%;">
                    <input type="password" name="txtsenha" id="senhaAdmin"
                        placeholder="Digite sua Senha:" autocomplete="new-password" required>

                    <button type="button" id="btnToggleSenhaAdmin"
                        onclick="toggleSenha('senhaAdmin', this)"
                        aria-label="Mostrar ou ocultar senha"
                        style="position: absolute; right: 55px; top: 50%; transform: translateY(-50%); background: none; border: none; width: auto; height: auto; margin: 0; padding: 0; font-size: 20px; cursor: pointer;">
                        👁️
                    </button>
                </div>

                <label for="cpfAdmin">CPF:</label>
                <input type="text" name="txtcpf" id="cpfAdmin"
                    maxlength="14" placeholder="000.000.000-00"
                    autocomplete="off" required>

            </div>

            <div class="colunasBotao">
                <button type="reset" onclick="resetarFormularioAdmin()">Limpar</button>
                <button type="submit">Enviar</button>
            </div>

        </fieldset>
    </form>

    <p class="cadastrar-se">
        Já tem Login?
        <a class="linklogin" href="loginAdmin.html">Logar-se</a>
    </p>

    <p class="cadastrar-se">
        É cliente?
        <a class="linkcadastro" href="cadastro.html">Cadastro de cliente</a>
    </p>

    <footer>
        <p>&copy; Copyright. Shadow Realm 2026. Todos os direitos reservados.</p>
        <a href="#topo">Voltar ao topo</a>
    </footer>

    <div id="modalCadastroAdmin" class="modal">
        <div class="modal-conteudo">

            <h2>Confira seus dados de Cadastro</h2>

            <ul id="listaDadosAdmin"></ul>

            <div class="modal-botoes">
                <button type="button" onclick="fechaModalAdmin()">
                    Corrigir Cadastro
                </button>

                <button type="button" onclick="confirmaCadastroAdmin()">
                    Confirmar cadastro
                </button>
            </div>

        </div>
    </div>

    <script>
        function resetarFormularioAdmin() {
            const inputSenha = document.getElementById("senhaAdmin");
            const btnOlho = document.getElementById("btnToggleSenhaAdmin");
            if (inputSenha) inputSenha.type = "password";
            if (btnOlho) btnOlho.textContent = "👁️";
        }

        document.addEventListener("DOMContentLoaded", () => {
            const modalAdmin = document.getElementById("modalCadastroAdmin");
            if (modalAdmin) {
                modalAdmin.addEventListener("click", (e) => {
                    if (e.target === modalAdmin && typeof fechaModalAdmin === "function") {
                        fechaModalAdmin();
                    }
                });
            }

            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape" && modalAdmin && modalAdmin.classList.contains("aberto")) {
                    if (typeof fechaModalAdmin === "function") fechaModalAdmin();
                }
            });
        });
    </script>

</body>
</html>
