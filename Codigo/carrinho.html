<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Keywords" content="Loja geek, figures, Shadow Realm Store">
    <meta name="author" content="Shadow Realm">
    <title>Shadow Realm Store - Carrinho</title>
    <link rel="stylesheet" href="site.css">
</head>

<body>
    <header>
        <a href="index.html"><img src="imagens/logo.png" class="logo" alt="Logo Shadow Realm Store"></a>
        <h1>Shadow Realm Store</h1>
        <nav class="nav">
            <a href="carrinho.html" class="link">Carrinho</a>
            <a href="contato.html" class="link">Contato</a>
            <a href="cliente.html" class="link">Login</a>
            <a href="cadastro.html" class="link">Cadastro</a>
            <a href="produtos.html" class="link">Produtos</a>
        </nav>
    </header>

    <!-- Área Principal (Fundo Escuro) -->
    <main class="cart-content">

        <!-- Lista de Produtos (Lado Esquerdo) - O JS do seu colega vai preencher aqui -->
        <section class="products-list" id="products-list">
            <p class="empty-cart-msg" style="color: #ffffff; text-align: center;">Seu carrinho está vazio.</p>
        </section>

        <!-- Resumo de Valores e Checkout (Lado Direito) -->
        <aside class="checkout-summary">
            <h2>Total:</h2>

            <div class="price-breakdown">
                <p class="price-item">R$ 0,00</p>
                <hr class="summary-divider">
                <p class="total-final">Valor Total: <span>R$ 0,00</span></p>
            </div>

            <div class="coupon-field">
                <label for="coupon-input">Cupom:</label>
                <input type="text" id="coupon-input" placeholder="Ex: Shadow26">
                <button type="button" id="btn-coupon">Aplicar</button>
            </div>
            <small id="coupon-message" style="display: block; text-align: center; margin-bottom: 10px; font-size: 0.85rem;"></small>

            <a href="#tela-pagamento" class="btn-buy">Comprar</a>
        </aside>

    </main>

    <!-- ==========================================
     TELA 2: PAGAMENTO E FRETE (Abre via CSS)
     ========================================== -->
    <div class="payment-screen-container" id="tela-pagamento">
        <div class="modal-container">

            <header class="modal-header">
                <h2>Forma de Pagamento e Frete</h2>
                <a href="#tela-carrinho" class="btn-close-modal" aria-label="Voltar para o carrinho">&times;</a>
            </header>

            <div class="modal-content">

                <!-- Coluna Esquerda: Opções de Pagamento -->
                <section class="payment-column">
                    <p class="modal-total-value">Valor Total: R$ 0,00</p>

                    <fieldset class="payment-methods">
                        <legend>Forma de pagamento:</legend>

                        <label class="method-option">
                            <input type="radio" name="payment-group" value="pix" checked>
                            <span>Pix</span>
                        </label>

                        <label class="method-option">
                            <input type="radio" name="payment-group" value="debito">
                            <span>Débito</span>
                        </label>

                        <label class="method-option">
                            <input type="radio" name="payment-group" value="parcelado">
                            <span class="multiline">Parcelado em até<br>12x sem Juros</span>
                        </label>
                    </fieldset>
                </section>

                <div class="vertical-divider"></div>

                <!-- Coluna Direita: Inputs de Endereço -->
                <form class="address-column">
                    <h3>Informe seu endereço:</h3>

                    <div class="form-group">
                        <label for="input-rua">Rua:</label>
                        <input type="text" id="input-rua" placeholder="Ex: Rua Dona Elza Mainertins" required>
                    </div>

                    <div class="form-group">
                        <label for="input-estado">Estado:</label>
                        <input type="text" id="input-estado" placeholder="Ex: Santa Catarina" required>
                    </div>

                    <div class="form-group">
                        <label for="input-cidade">Cidade:</label>
                        <input type="text" id="input-cidade" placeholder="Ex: Joinville" required>
                    </div>

                    <button type="submit" class="btn-confirm-payment">Confirmar pagamento</button>
                </form>

            </div>
        </div>
    </div>

    <footer>
        &copy; Copyright. Shadow Realm 2026. Todos os direitos reservados.
    </footer>

    <script src="site.js"></script>
</body>

</html>
