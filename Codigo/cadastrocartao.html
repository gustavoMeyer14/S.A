<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Keywords" content="Loja geek, figures, Shadow Realm Store">
    <meta name="author" content="Shadow Realm">
    <title>Shadow Realm Store - Cadastro de Cartão</title>
    <link rel="stylesheet" href="site.css">
</head>

<body>
    <header>
        <a href="index.html"><img src="imagens/logo.png" class="logo"></a>
        <h1>- Shadow Realm Store -</h1>
        <div class="nav">
            <nav>
                <a href="index.html" class="link"><img src="imagens/Casinha-removebg-preview.png"></a>
                <a href="carrinho.html" class="link"><img src="imagens/carrinho-removebg-preview.png"></a>
                <a href="contato.html" class="link"><img src="imagens/contato.png"></a>
                <a href="produtos.html" class="link"><img src="imagens/produto.png"></a>
                <button type="button" class="botaoUsuario" onclick="abreModalCliente()"><img src="imagens/Usuario.png"></button>
            </nav>
        </div>
    </header>

    <div class="modalCliente" id="modalCliente">
        <div class="modalCliente-conteudo">
            <h2 style="font-size: 30px;">Usuário</h2>
            <nav class="nav-usuario">
                <a href="cadastro.html">cadastro</a>
                <a href="cliente.html">Login</a>
                <a href="cadastrocartao.html">Cadastrar cartão</a>
                <button type="button" onclick="fechaModalCliente()" class="botaoFecharCliente">Fechar</button>
            </nav>
        </div>
    </div>

    <main>
        <h2 style="margin: 20px;">Explore este mundo geek apenas se cadastrando!</h2>

        <form id="formCartao" class="formLogin">
            <fieldset class="login">
                <div class="colunas">
                    <label for="numero">Número do cartão:</label>
                    <input type="text" id="numero" maxlength="19" placeholder="Os 16 digitos da frente do cartão"
                        required>



                    <label for="titular">Nome do titular:</label>
                    <input type="text" id="titular" placeholder="Exatamente como impresso no cartão" required>
                </div>

                <div class="colunas">
                    <label for="validade">Data de validade:</label>
                    <input type="text" id="validade" maxlength="5" placeholder="Mês e ano (ex: 08/30)" required>

                    <label for="cvv">CVV:</label>
                    <input type="text" id="cvv" maxlength="3" placeholder="3 Dígitos que fica no verso do cartão"
                        required>
                </div>

                <div class="colunas" style="width: 300px;">
                    <label for="endereco">Endereço de cobrança:</label>
                    <input type="text" id="endereco" style="width: 250px;"
                        placeholder="Solicitado para confirmar a segurança" required>
                    <button type="submit" style="width: 235px;">Cadastrar Cartão</button>
                </div>

            </fieldset>
        </form>
    </main>

    <!-- Modal com os dados preenchidos -->
    <dialog id="modalDados">
        <h3>Confira os Dados do Cartão</h3>
        <div id="conteudoModal">
            <p><strong>Número do cartão:</strong> <span id="resNumero"></span></p>
            <p><strong>Nome do titular:</strong> <span id="resTitular"></span></p>
            <p><strong>Data de validade:</strong> <span id="resValidade"></span></p>
            <p><strong>CVV:</strong> <span id="resCvv"></span></p>
            <p><strong>Endereço de cobrança:</strong> <span id="resEndereco"></span></p>
        </div>
        <div>
            <button type="button" id="btnCorrigir" class="btnCartão">Corrigir</button>
            <button type="button" id="btnConfirmar" class="btnCartão">Confirmar Cadastro</button>
        </div>
    </dialog>

    <script src="site.js"></script>

    <footer>
        &copy; Copyright. Shadow Realm 2026. Todos os direitos reservados.
    </footer>
</body>

</html>
