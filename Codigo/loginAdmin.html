<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso Administrativo - Shadow Realm Store</title>
    <link rel="stylesheet" href="melhorias.css">
    <script src="modais-globais.js"></script>
    <style>
        :root {
            --sr-admin-bg: #151515;
            --sr-admin-card: #0d0d0d;
            --sr-admin-input-bg: #151515;
            --sr-admin-border: #333333;
            --sr-admin-accent: #C62828;
            --sr-admin-accent-hover: #ff4d4d;
            --sr-admin-text: #ffffff;
            --sr-admin-muted: #aaaaaa;
            --sr-admin-label: #cccccc;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: var(--sr-admin-bg);
            color: var(--sr-admin-text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-image: radial-gradient(circle at top, rgba(198, 40, 40, 0.18), transparent 60%);
        }

        .admin-login-card {
            width: 100%;
            max-width: 420px;
            background-color: var(--sr-admin-card);
            border: 1px solid var(--sr-admin-accent);
            border-radius: 20px;
            padding: 36px 30px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.85);
            text-align: center;
        }

        .admin-badge {
            display: inline-block;
            background-color: rgba(198, 40, 40, 0.18);
            color: var(--sr-admin-accent-hover);
            border: 1px solid var(--sr-admin-accent);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 14px;
        }

        .admin-login-card h1 {
            font-size: 26px;
            margin-bottom: 6px;
            color: var(--sr-admin-text);
        }

        .admin-login-card p {
            font-size: 14px;
            color: var(--sr-admin-muted);
            margin-bottom: 26px;
        }

        .campo-admin {
            text-align: left;
            margin-bottom: 18px;
        }

        .campo-admin label {
            display: block;
            font-size: 13px;
            color: var(--sr-admin-label);
            margin-bottom: 6px;
            font-weight: bold;
        }

        .input-wrapper {
            position: relative;
        }

        .campo-admin input {
            width: 100%;
            height: 46px;
            padding: 0 44px 0 14px;
            background-color: var(--sr-admin-input-bg);
            border: 1px solid var(--sr-admin-border);
            border-radius: 12px;
            color: var(--sr-admin-text);
            font-size: 15px;
            transition: border-color 0.25s, box-shadow 0.25s;
            outline: none;
        }

        .campo-admin input:focus {
            border-color: var(--sr-admin-accent);
            box-shadow: 0 0 0 3px rgba(198, 40, 40, 0.25);
        }

        .btn-olho {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--sr-admin-muted);
            font-size: 18px;
            cursor: pointer;
            padding: 4px;
            transition: color 0.2s;
        }

        .btn-olho:hover {
            color: var(--sr-admin-text);
        }

        .btn-entrar-admin {
            width: 100%;
            height: 48px;
            margin-top: 8px;
            background-color: var(--sr-admin-accent);
            color: var(--sr-admin-text);
            border: 1px solid var(--sr-admin-accent);
            border-radius: 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.25s, box-shadow 0.25s, transform 0.25s;
        }

        .btn-entrar-admin:hover {
            background-color: var(--sr-admin-bg);
            box-shadow: 0 6px 20px rgba(198, 40, 40, 0.5);
            transform: translateY(-2px);
        }

        .link-voltar-loja {
            display: inline-block;
            margin-top: 22px;
            color: var(--sr-admin-muted);
            text-decoration: none;
            font-size: 14px;
            transition: color 0.2s;
        }

        .link-voltar-loja:hover {
            color: var(--sr-admin-accent-hover);
        }
    </style>
</head>
<body>
    <main class="admin-login-card">
        <span class="admin-badge">🔒 Área Restrita</span>
        <h1>Shadow Realm Admin</h1>
        <p>Faça login para gerenciar estoque, pedidos e produtos.</p>

        <form id="form-login-admin" name="frmLoginAdmin">
            <div class="campo-admin">
                <label for="admin-user">E-mail</label>
                <input type="email" id="admin-user" name="txtemail"
                    placeholder="Digite seu e-mail admin" required autocomplete="username">
            </div>

            <div class="campo-admin">
                <label for="admin-pass">Senha</label>
                <div class="input-wrapper">
                    <input type="password" id="admin-pass" name="txtsenha"
                        placeholder="Digite sua senha" required autocomplete="current-password">
                    <button type="button" class="btn-olho" id="toggle-senha"
                        aria-label="Mostrar ou ocultar senha" title="Mostrar/Ocultar senha">👁️</button>
                </div>
            </div>

            <button type="submit" class="btn-entrar-admin" id="btn-entrar-admin">Entrar no Painel</button>
        </form>

        <a href="index.html" class="link-voltar-loja">← Voltar para a Shadow Realm Store</a>
    </main>

    <script src="admin.js"></script>
    <script>
        const formAdmin = document.getElementById('form-login-admin');
        const btnOlho = document.getElementById('toggle-senha');
        const inputSenha = document.getElementById('admin-pass');
        const btnEntrar = document.getElementById('btn-entrar-admin');
        let enviandoLoginAdmin = false;

        btnOlho?.addEventListener('click', () => {
            if (!inputSenha) return;
            const mostrando = inputSenha.type === 'text';
            inputSenha.type = mostrando ? 'password' : 'text';
            btnOlho.textContent = mostrando ? '👁️' : '🙈';
        });

        formAdmin?.addEventListener('submit', (e) => {
            e.preventDefault();
            if (enviandoLoginAdmin || typeof validaLoginAdmin !== 'function') return;

            enviandoLoginAdmin = true;
            if (btnEntrar) btnEntrar.disabled = true;

            try {
                validaLoginAdmin();
            } finally {
                setTimeout(() => {
                    enviandoLoginAdmin = false;
                    if (btnEntrar) btnEntrar.disabled = false;
                }, 400);
            }
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const modalGlobal = document.getElementById('sr-modal-global');
                if (modalGlobal && typeof modalGlobal.close === 'function' && modalGlobal.open) {
                    modalGlobal.close();
                }
            }
        });
    </script>
</body>
</html>
