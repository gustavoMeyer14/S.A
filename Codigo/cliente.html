<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Keywords" content="Loja geek, figures, Shadow Realm Store">
    <meta name="author" content="Shadow Realm">
    <title>Shadow Realm Store - Login</title>
    <link rel="stylesheet" href="site.css">
    <script src="site.js"></script>
</head>

<body>
    <header>
        <a href="index.html"><img src="imagens/logo.png" class="logo"></a>
        <h1>- Shadow Realm Store -</h1>
        <nav class="nav">
            <a href="carrinho.html" class="link">Carrinho</a>
            <a href="" class="link">Contato</a>
            <a href="cliente.html" class="link">Login</a>
            <a href="cadastro.html" class="link">Cadastro</a>
        </nav>
    </header>

    <form name="frmlogin" method="post" action="#" onsubmit="return validaLogin()" class="formLogin"
        style="height: 500px;">

        <!-- Grupo 1: Campos de informações pessoais -->
        <fieldset class="login">
            <label for="email">Email: </label>
            <input type="email" name="txtemail" id="email" placeholder="Digite seu email:">

            <label for="senha">Senha: </label>
            <input type="password" name="txtsenha" id="senha" placeholder="Digite sua Senha:">

            <button type="reset" onclick="verificaMotivo(null)">Limpar</button><button type="submit">Enviar</button>

        </fieldset>
    </form>

    <p class="cadastrar-se">Não tem Login? <a class="linkcadastro" href="cadastro.html">Cadastre-se</a></p>

    <footer>
        &copy; Copyright. Shadow Realm 2026. Todos os direitos reservados.
    </footer>

    <!-- Janela Modal -->
    <div id="modalDadosLogin" class="modal">
        <div class="modal-conteudo">
            <h2>Confira seus dados de Login</h2>
            <ul id="listaDadosLogin"></ul>
            <div class="modal-botoes">
                <button type="button" onclick="fechaModalLogin()">Corrigir Login</button>
                <button type="button" onclick="confirmaLogin()">Confirmar Login</button>
            </div>
        </div>
    </div>
</body>

</html>
