<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Keywords" content="Loja geek, figures, Shadow Realm Store">
    <meta name="author" content="Shadow Realm">
    <title>Shadow Realm Store - Login</title>
    <link rel="stylesheet" href="site.css">
    <script src="site.js"></script>
    <script src="conta.js" defer></script>
</head>

<body>
    <header id="topo">
        <a href="index.html"><img src="imagens/logo.png" class="logo"></a>
        <h1>- Shadow Realm Store -</h1>
        <div class="nav">
            <nav>
                <a href="index.html" class="link"><img src="imagens/Casinha-removebg-preview.png"></a>
                <a href="produtos.html" class="link"><img src="imagens/produto.png"></a>
                <a href="contato.html" class="link"><img src="imagens/contato.png"></a>
                <a href="carrinho.html" class="link"><img src="imagens/carrinho-removebg-preview.png"></a>
                <button type="button" class="botaoUsuario" onclick="abreModalCliente()"><img
                        src="imagens/Usuario.png"></button>
            </nav>
        </div>
    </header>

    <div class="modalCliente" id="modalCliente">
        <div class="modalCliente-conteudo">
            <h2>- Menu do usuário -</h2>
            <nav class="nav-usuario">
                <a href="cadastroAdmin.html">Cadastro do Administrador</a>
                 <a href="loginAdmin.html">Login Adm</a>
                <a href="cadastro.html">Cadastro</a>
                <a href="cliente.html">Login</a>
                <a href="cadastrocartao.html">Cadastrar cartão</a>
                <a href="pedidos.html">Meus Pedidos</a>
            </nav>
            <button type="button" onclick="fechaModalCliente()" class="botaoFecharCliente">Fechar</button>
        </div>
    </div>

    <h2 style="font-size: 35px; margin: 20px;">Login</h2>

    <form name="frmlogin" method="post" action="#" onsubmit="event.preventDefault(); validaLogin();" class="formLogin"
        style="height: 360px; width: 925px;">
        <fieldset class="login">
            <div class="colunas">
                <label for="email">Email: </label>
                <input type="email" name="txtemail" id="email" placeholder="Digite seu email:">

                <label for="senha">Senha: </label>
                <div style="position: relative; display: inline-block; width: 100%;">
                    <input type="password" name="txtsenha" id="senha" placeholder="Digite sua Senha:">
                    <button type="button" onclick="toggleSenha('senha', this)" style="position: absolute; right: 55px; top: 50%; transform: translateY(-50%); background: none; border: none; width: auto; height: auto; margin: 0; padding: 0; font-size: 20px; cursor: pointer;">👁️</button>
                </div>
            </div>

            <div class="colunasBotao">
                <button type="reset" onclick="verificaMotivo(null)">Limpar</button><button type="submit">Enviar</button>
            </div>
        </fieldset>
    </form>

    <p class="cadastrar-se">Não tem Login? <a class="linkcadastro" href="cadastro.html">Cadastre-se</a></p>

    <footer>
        <p>&copy; Copyright. Shadow Realm 2026. Todos os direitos reservados.</p>
        <a href="#topo">Voltar ao topo</a>
    </footer>

    <!-- Janela Modal -->
    <div id="modalDadosLogin" class="modal">
        <div class="modal-conteudo">
            <h2>Confira seus dados de Login</h2>
            <ul id="listaDadosLogin"></ul>
            <div class="modal-botoes">
                <button type="button" onclick="fechaModalLogin()">Corrigir Login</button>
                <button type="button" onclick="confirmaLogin()">Confirmar Login</button>
            </div>
        </div>
    </div>
</body>

</html>
