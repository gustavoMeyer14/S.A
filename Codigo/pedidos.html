<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Keywords" content="Loja geek, figures, Shadow Realm Store, pedidos">
    <meta name="author" content="Shadow Realm">
    <title>Shadow Realm Store - Meus Pedidos</title>
    <link rel="stylesheet" href="site.css">
    <script src="site.js" defer></script>
    <script src="admin.js" defer></script>
    <script src="conta.js" defer></script>
    <script src="shopee.js" defer></script>
    <script src="vitrini.js" defer></script>
    <script src="estoque.js" defer></script>
    <link rel="stylesheet" href="melhorias.css">
    <script src="modais-globais.js"></script>
    <script src="favoritos.js" defer></script>
    <script src="extras-loja.js" defer></script>
    <link rel="stylesheet" href="ajustes-seguros.css">
<script src="loja-turbo.js" defer></script>
<script src="integracao-segura.js" defer></script>

    <style>
        .pedidos-container {
            max-width: 1100px;
            width: 92%;
            margin: 40px auto;
            padding: 30px;
            background-color: #0d0d0d;
            border: 2px solid #C62828;
            border-radius: 20px;
            min-height: 55vh;
        }

        .pedidos-titulo {
            text-align: center;
            margin-bottom: 30px;
            font-size: 32px;
        }

        .pedido-card {
            background-color: #1b1b1b;
            border: 1px solid #C62828;
            border-radius: 15px;
            padding: 22px;
            margin-bottom: 25px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.4);
        }

        .pedido-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-bottom: 1px solid #333;
            padding-bottom: 12px;
            margin-bottom: 15px;
        }

        .pedido-numero {
            font-size: 20px;
            font-weight: bold;
            color: #ff4d4d;
        }

        .pedido-status {
            background-color: #2e7d32;
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
        }

        .pedido-status.cancelado {
            background-color: #8e1616;
            color: #ffd6d6;
        }

        .pedido-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin-bottom: 18px;
            font-size: 15px;
            color: #e0e0e0;
        }

        .pedido-itens-lista {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .pedido-item-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background-color: #121212;
            padding: 10px 15px;
            border-radius: 10px;
            border: 1px solid #2a2a2a;
            gap: 15px;
            flex-wrap: wrap;
        }

        .pedido-item-esquerda {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .pedido-item-esquerda img {
            width: 55px;
            height: 55px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #C62828;
        }

        .pedido-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px solid #333;
        }

        .pedido-total {
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
        }

        .pedido-acoes {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-rastrear {
            background-color: #b82929;
            color: #ffffff;
            border: 1px solid #c62828;
            border-radius: 20px;
            padding: 8px 15px;
            font-weight: bold;
            cursor: pointer;
            width: 200px;
            height: 50px;
            margin: 0;
        }

        .btn-rastrear:hover {
            background-color: #151515;
            scale: 110%;
            transition: 0.3s;
            box-shadow: 0 10px 25px #c62828;
        }

        .btn-cancelar-pedido {
            background-color: transparent;
            color: #ff4d4d;
            border: 1px solid #ff4d4d;
            border-radius: 20px;
            padding: 8px 15px;
            font-weight: bold;
            cursor: pointer;
            width: 200px;
            height: 50px;
            margin: 0;
        }

        .btn-cancelar-pedido:hover {
            background-color: #ff4d4d;
            color: #ffffff;
            scale: 110%;
            transition: 0.3s;
            box-shadow: 0 10px 25px #c62828;
        }

        .sem-pedidos {
            text-align: center;
            padding: 40px 20px;
            background-color: #1b1b1b;
            border-radius: 15px;
            border: 1px dashed #C62828;
        }

        .sem-pedidos p {
            font-size: 18px;
            margin-bottom: 20px;
        }

        .sem-pedidos a {
            display: inline-block;
            background-color: #b82929;
            color: #ffffff;
            text-decoration: none;
            padding: 12px 24px;
            border-radius: 25px;
            font-weight: bold;
        }

        .modalRastreio[open] {
            position: fixed !important;
            top: 50% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) !important;
            margin: 0 !important;
            background-color: #1a1a1a;
            color: #ffffff;
            border: 2px solid #b82929;
            border-radius: 15px;
            padding: 25px;
            max-width: 500px;
            width: 90%;
            text-align: center;
        }

        .modalRastreio::backdrop {
            background-color: rgba(0, 0, 0, 0.75);
        }

        .acoes-modal-cancelar {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
        }

        .btn-confirmar-cancelamento {
            background-color: #b82929;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-manter-pedido {
            background-color: #333333;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <header id="topo">
        <a href="index.html"><img src="imagens/logo.png" class="logo" alt="Logo Shadow Realm Store"></a>
        <h1>- Shadow Realm Store -</h1>
        <div class="nav">
            <nav>
                <a href="index.html" class="link"><img src="imagens/Casinha-removebg-preview.png" alt="Início"></a>
                <a href="produtos.html" class="link"><img src="imagens/produto.png" alt="Produtos"></a>
                <a href="contato.html" class="link"><img src="imagens/contato.png" alt="Contato"></a>
                <a href="carrinho.html" class="link"><img src="imagens/carrinho-removebg-preview.png"
                        alt="Carrinho"></a>
                <button type="button" class="botaoUsuario" onclick="abreModalCliente()" aria-label="Menu do usuário"><img
                        src="imagens/Usuario.png" alt="Usuário"></button>
            </nav>
        </div>
    </header>

    <div class="modalCliente" id="modalCliente">
        <div class="modalCliente-conteudo">
            <h2>- Menu do usuário -</h2>
            <nav class="nav-usuario">
                <a href="cadastro.html">Cadastro</a>
                <a href="cliente.html">Login</a>
                <a href="cadastrocartao.html">Cadastrar cartão</a>
                <a href="pedidos.html">Meus Pedidos</a>
            </nav>
            <button type="button" onclick="fechaModalCliente()" class="botaoFecharCliente">Fechar</button>
        </div>
    </div>

    <main class="pedidos-container">
        <h2 class="pedidos-titulo">- Meus Pedidos -</h2>
        <div id="listaPedidos"></div>
    </main>

    <dialog id="modalRastreio" class="modalRastreio">
        <h2 style="text-align: center; margin-bottom: 15px;">- Rastreio do Pedido -</h2>
        <p id="textoRastreio" style="color: #ddd; font-size: 15px; line-height: 1.5; text-align: center;"></p>
        <div style="text-align: center; margin-top: 20px;">
            <button type="button" id="fecharRastreio" class="btn-manter-pedido">Fechar</button>
        </div>
    </dialog>

    <dialog id="modalCancelarPedido" class="modalRastreio">
        <h2 style="text-align: center; margin-bottom: 15px;">- Cancelar Pedido -</h2>
        <p id="textoCancelarPedido" style="color: #ddd; font-size: 15px; line-height: 1.5; text-align: center;">
            Tem certeza de que deseja cancelar este pedido?
        </p>
        <div class="acoes-modal-cancelar">
            <button type="button" id="btnConfirmarCancelamento" class="btn-confirmar-cancelamento">Sim, cancelar</button>
            <button type="button" id="btnManterPedido" class="btn-manter-pedido">Manter pedido</button>
        </div>
    </dialog>

    <footer>
        <p>&copy; Copyright. Shadow Realm 2026. Todos os direitos reservados.</p>
        <a href="#topo">Voltar ao topo</a>
    </footer>

    <script>
        let pedidoAlvoCancelamento = null;

        function exibirAvisoPedidos(mensagem, titulo = '- Meus Pedidos -', aoFechar = null) {
            if (window.srModal && typeof window.srModal.alerta === 'function') {
                window.srModal.alerta(mensagem, titulo);
                if (typeof aoFechar === 'function') {
                    const btnOk = document.getElementById('sr-btn-ok');
                    const dialog = document.getElementById('sr-modal-global');
                    if (btnOk) {
                        btnOk.addEventListener('click', aoFechar, { once: true });
                    } else if (dialog) {
                        dialog.addEventListener('close', aoFechar, { once: true });
                    }
                }
            } else if (typeof aoFechar === 'function') {
                aoFechar();
            }
        }

        function confirmarAcaoPedidos(mensagem, aoConfirmar, titulo = '- Confirmação -') {
            if (window.srModal && typeof window.srModal.confirmar === 'function') {
                window.srModal.confirmar(mensagem, aoConfirmar, titulo);
            } else if (typeof aoConfirmar === 'function') {
                aoConfirmar();
            }
        }

        function renderizarPedidos() {
            const container = document.getElementById('listaPedidos');
            if (!container) return;

            const estaLogado = localStorage.getItem('usuarioLogado') === 'true';
            const usuarioAtual = (localStorage.getItem('usuarioAtual') || '').trim().toLowerCase();

            if (!estaLogado || !usuarioAtual) {
                container.innerHTML = `
                    <div class="sem-pedidos">
                        <p>Você precisa estar logado para visualizar seus pedidos.</p>
                        <a href="cliente.html">Fazer Login</a>
                    </div>
                `;
                return;
            }

            let todosPedidos = [];
            try {
                todosPedidos = JSON.parse(localStorage.getItem('pedidosShadowRealm')) || [];
            } catch {
                todosPedidos = [];
            }

            const pedidosUsuario = todosPedidos.filter(
                p => (p.clienteEmail || '').trim().toLowerCase() === usuarioAtual
            );

            if (pedidosUsuario.length === 0) {
                container.innerHTML = `
                    <div class="sem-pedidos">
                        <p>Você ainda não realizou nenhum pedido na Shadow Realm Store.</p>
                        <a href="produtos.html">Explorar Produtos</a>
                    </div>
                `;
                return;
            }

            container.innerHTML = '';

            [...pedidosUsuario].reverse().forEach((pedido) => {
                const itensHTML = (pedido.itens || []).map(item => {
                    const subtotal = (Number(item.preco) || 0) * (Number(item.quantidade) || 1);
                    return `
                        <div class="pedido-item-row">
                            <div class="pedido-item-esquerda">
                                <img src="${item.imagem || 'imagens/logo.png'}" alt="${item.nome}">
                                <div>
                                    <strong>${item.nome}</strong><br>
                                    <small>Quantidade: ${item.quantidade} × R$ ${Number(item.preco).toFixed(2).replace('.', ',')}</small>
                                </div>
                            </div>
                            <div>
                                <strong>R$ ${subtotal.toFixed(2).replace('.', ',')}</strong>
                            </div>
                        </div>
                    `;
                }).join('');

                const estaCancelado = pedido.status === 'Cancelado';
                const classeStatus = estaCancelado ? 'pedido-status cancelado' : 'pedido-status';

                const card = document.createElement('article');
                card.className = 'pedido-card';
                card.innerHTML = `
                    <div class="pedido-header">
                        <span class="pedido-numero">Pedido #${pedido.numeroPedido}</span>
                        <span class="${classeStatus}">${pedido.status || 'Pedido Confirmado'}</span>
                    </div>

                    <div class="pedido-info-grid">
                        <div><strong>Data:</strong> ${pedido.data || '-'}</div>
                        <div><strong>Pagamento:</strong> ${pedido.cartaoUsado || '-'}</div>
                        <div><strong>Endereço:</strong> ${pedido.enderecoEntrega || '-'}</div>
                    </div>

                    <div class="pedido-itens-lista">
                        ${itensHTML}
                    </div>

                    <div class="pedido-footer">
                        <span class="pedido-total">Total: R$ ${Number(pedido.total || 0).toFixed(2).replace('.', ',')}</span>
                        <div class="pedido-acoes">
                            <button type="button" class="btn-rastrear" onclick="rastrearPedido(${pedido.numeroPedido})">Rastrear Pedido</button>
                            ${!estaCancelado ? `<button type="button" class="btn-cancelar-pedido" onclick="abrirModalCancelarPedido(${pedido.numeroPedido})">Cancelar Pedido</button>` : ''}
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function rastrearPedido(numeroPedido) {
            const modal = document.getElementById('modalRastreio');
            const texto = document.getElementById('textoRastreio');
            let todosPedidos = [];
            try {
                todosPedidos = JSON.parse(localStorage.getItem('pedidosShadowRealm')) || [];
            } catch {}

            const pedido = todosPedidos.find(p => Number(p.numeroPedido) === Number(numeroPedido));

            if (!pedido) return;

            if (pedido.status === 'Cancelado') {
                texto.innerHTML = `O pedido <strong>#${pedido.numeroPedido}</strong> foi cancelado e o envio não será realizado.`;
            } else {
                texto.innerHTML = `
                    Pedido <strong>#${pedido.numeroPedido}</strong><br>
                    Status atual: <strong>${pedido.status || 'Pedido Confirmado'}</strong><br>
                    Destino: <strong>${pedido.enderecoEntrega || 'Endereço cadastrado'}</strong><br>
                    Previsão de entrega: <strong>5 a 8 dias úteis</strong>.
                `;
            }

            if (modal && typeof modal.showModal === 'function') {
                modal.showModal();
            }
        }

        function abrirModalCancelarPedido(numeroPedido) {
            pedidoAlvoCancelamento = numeroPedido;
            const modal = document.getElementById('modalCancelarPedido');
            const texto = document.getElementById('textoCancelarPedido');
            if (texto) {
                texto.innerHTML = `Tem certeza de que deseja cancelar o pedido <strong>#${numeroPedido}</strong>?`;
            }
            if (modal && typeof modal.showModal === 'function') {
                modal.showModal();
            }
        }

        function executarCancelamentoPedido() {
            if (pedidoAlvoCancelamento === null) return;

            let todosPedidos = [];
            try {
                todosPedidos = JSON.parse(localStorage.getItem('pedidosShadowRealm')) || [];
            } catch {}

            const indice = todosPedidos.findIndex(p => Number(p.numeroPedido) === Number(pedidoAlvoCancelamento));
            if (indice !== -1 && todosPedidos[indice].status !== 'Cancelado') {
                todosPedidos[indice].status = 'Cancelado';
                localStorage.setItem('pedidosShadowRealm', JSON.stringify(todosPedidos));

                if (typeof obterEstoque === 'function' && typeof definirEstoque === 'function' && Array.isArray(todosPedidos[indice].itens)) {
                    todosPedidos[indice].itens.forEach(item => {
                        const atual = obterEstoque(item.nome);
                        definirEstoque(item.nome, atual + (Number(item.quantidade) || 1));
                    });
                }
            }

            const modal = document.getElementById('modalCancelarPedido');
            if (modal && modal.open) modal.close();
            pedidoAlvoCancelamento = null;
            renderizarPedidos();
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderizarPedidos();

            const btnFecharRastreio = document.getElementById('fecharRastreio');
            const modalRastreio = document.getElementById('modalRastreio');
            if (btnFecharRastreio && modalRastreio) {
                btnFecharRastreio.addEventListener('click', () => modalRastreio.close());
                modalRastreio.addEventListener('click', (e) => {
                    const rect = modalRastreio.getBoundingClientRect();
                    if (e.clientX < rect.left || e.clientX > rect.right || e.clientY < rect.top || e.clientY > rect.bottom) {
                        modalRastreio.close();
                    }
                });
            }

            const btnConfirmarCancelamento = document.getElementById('btnConfirmarCancelamento');
            const btnManterPedido = document.getElementById('btnManterPedido');
            const modalCancelarPedido = document.getElementById('modalCancelarPedido');

            if (btnConfirmarCancelamento) {
                btnConfirmarCancelamento.addEventListener('click', () => {
                    confirmarAcaoPedidos(
                        `Confirmar o cancelamento definitivo do pedido <strong>#${pedidoAlvoCancelamento}</strong>?`,
                        executarCancelamentoPedido,
                        '- Confirmar Cancelamento -'
                    );
                });
            }

            if (btnManterPedido && modalCancelarPedido) {
                btnManterPedido.addEventListener('click', () => {
                    pedidoAlvoCancelamento = null;
                    modalCancelarPedido.close();
                });
            }
        });
    </script>
</body>

</html>
