</head>
<body>
    <header>
    <div class="logo">
     
            <h1>Cadastro</h1>
        </div> 
    </header>


    <!-- NAVEGAÇÃO PRINCIPAL: Menu de links do site -->
    <nav>
        <a href="index.html" rel="next" target="_self">
            <div class="option">Menu</div>
        </a>

        <a href="produtos.html" rel="next" target="_self">
            <div class="option">Produtos</div>
        </a>

        <a href="" rel="next" target="_self">

        </a>

        </a>

        <a href="" rel="next" target="_self">
            <div class="option">....</div>
        </a>
    </nav>

    <form name="frmcadastro" method="post" action="#" onsubmit="return validaCadastro()">

        <!-- Grupo 1: Campos de informações pessoais -->
        <fieldset class="cadastro">

          <label for="nome">Nome Completo: </label>
          <input type="text" name="txtnome" id="nome" placeholder="Digite seu Nome Completo: ">

            <label for="email">Email: </label>
            <input type="email" name="txtemail" id="email" placeholder="Digite seu email:">

            <label for="senha">Senha: </label>
            <input type="password" name="txtsenha" id="senha" placeholder="Digite sua Senha:">
            
            <div class="buttonreset">
                <button type="reset" onclick="verificaMotivo(null)">Limpar</button>
            </div>
            <div class="buttonsubmit">
                <button type="submit">Enviar</button>
            </div>
        </fieldset> 
    </form> 

    <footer>
        <br><br>&copy; Copyright. Artech 2026. Todos os direitos reservados.
        <br><br><br>
    </footer>

    <!-- Janela Modal -->
    <div id="modalDadosCadastro" class="modal">
        <div class="modal-conteudo">
            <h2>Confira seus dados de Cadastro</h2>
            <ul id="listaDadosCadastro"></ul>
            <div class="modal-botoes">
                <button type="button" onclick="fechaModalCadastro()">Corrigir Cadastro</button>
                <button type="button" onclick="confirmaCadastro()">Confirmar Cadastro</button>
            </div>
        </div>
    </div>
</body>
</html>
