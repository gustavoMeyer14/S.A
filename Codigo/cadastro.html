<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Keywords" content="Loja geek, figures, Shadow Realm Store">
    <meta name="author" content="Shadow Realm">
    <title>Shadow Realm Store - Cadastro</title>
    <link rel="stylesheet" href="site.css">
    <script src="site.js"></script>
    <script src="conta.js" defer></script>
    <link rel="stylesheet" href="melhorias.css">
    <script src="modais-globais.js"></script>
    <script src="favoritos.js" defer></script>
    <script src="extras-loja.js" defer></script>
    <script src="extras-marketplace-sr.js" defer></script>
</head>

<body>
    <header id="topo">
        <a href="index.html"><img src="imagens/logo.png" class="logo" alt="Logo Shadow Realm Store"></a>
        <h1>- Shadow Realm Store -</h1>
        <div class="nav">
            <nav>
                <a href="index.html" class="link"><img src="imagens/Casinha-removebg-preview.png" alt="Início"></a>
                <a href="produtos.html" class="link"><img src="imagens/produto.png" alt="Produtos"></a>
                <a href="contato.html" class="link"><img src="imagens/contato.png" alt="Contato"></a>
                <a href="carrinho.html" class="link"><img src="imagens/carrinho-removebg-preview.png" alt="Carrinho"></a>
                <button type="button" class="botaoUsuario" onclick="abreModalCliente()" aria-label="Menu do usuário"><img
                        src="imagens/Usuario.png" alt="Usuário"></button>
            </nav>
        </div>
    </header>

    <div class="modalCliente" id="modalCliente">
        <div class="modalCliente-conteudo">
            <h2>- Menu do usuário -</h2>
            <nav class="nav-usuario">
                <a href="cadastro.html">Cadastro</a>
                <a href="cliente.html">Login</a>
                <a href="cadastrocartao.html">Cadastrar cartão</a>
                <a href="pedidos.html">Meus Pedidos</a>
            </nav>
            <button type="button" onclick="fechaModalCliente()" class="botaoFecharCliente">Fechar</button>
        </div>
    </div>

    <h2 style="font-size: 35px; margin: 20px;">Cadastro</h2>

    <form name="frmcadastro" method="post" class="formLogin" action="#" onsubmit="return validaCadastro()">

        <fieldset class="login">
            <div class="colunas">
                <label for="nome">Nome Completo: </label>
                <input type="text" name="txtnome" id="nome" class="" placeholder="Digite seu Nome Completo: "
                    autocomplete="name" required>

                <label for="email">Email: </label>
                <input type="email" name="txtemail" id="email" placeholder="Digite seu email:"
                    autocomplete="email" required>
            </div>

            <div class="colunas">
                <label for="senha">Senha: </label>
                <div style="position: relative; display: inline-block; width: 100%;">
                    <input type="password" name="txtsenha" id="senha" placeholder="Digite sua Senha:"
                        autocomplete="new-password" required>
                    <button type="button" id="btnToggleSenhaCadastro" onclick="toggleSenha('senha', this)"
                        aria-label="Mostrar ou ocultar senha"
                        style="position: absolute; right: 55px; top: 50%; transform: translateY(-50%); background: none; border: none; width: auto; height: auto; margin: 0; padding: 0; font-size: 20px; cursor: pointer;">👁️</button>
                </div>

                <label for="cpf">CPF: </label>
                <input type="text" name="txtcpf" id="cpf" maxlength="14" placeholder="000.000.000-00"
                    autocomplete="off" required>
            </div>

            <div class="colunasBotao">
                <button type="reset" onclick="resetarFormularioCadastro()">Limpar</button>
                <button type="submit">Enviar</button>
            </div>

        </fieldset>
    </form>

    <p class="cadastrar-se">Já tem Login? <a class="linklogin" href="cliente.html">Logar-se</a></p>

    <footer>
        <p>&copy; Copyright. Shadow Realm 2026. Todos os direitos reservados.</p>
        <a href="#topo">Voltar ao topo</a>
    </footer>

    <div id="modalDadosCadastro" class="modal">
        <div class="modal-conteudo">
            <h2>Confira seus dados de Cadastro</h2>
            <ul id="listaDadosCadastro"></ul>
            <div class="modal-botoes">
                <button type="button" onclick="fechaModalCadastro()">Corrigir Cadastro</button>
                <button type="button" onclick="confirmaCadastro()">Confirmar cadastro</button>
            </div>
        </div>
    </div>

    <script>
        function resetarFormularioCadastro() {
            const inputSenha = document.getElementById('senha');
            const btnOlho = document.getElementById('btnToggleSenhaCadastro');
            if (inputSenha) inputSenha.type = 'password';
            if (btnOlho) btnOlho.textContent = '👁️';
            if (typeof verificaMotivo === 'function') verificaMotivo(null);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const modalCadastro = document.getElementById('modalDadosCadastro');
            if (modalCadastro) {
                modalCadastro.addEventListener('click', (e) => {
                    if (e.target === modalCadastro && typeof fechaModalCadastro === 'function') {
                        fechaModalCadastro();
                    }
                });
            }

            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && modalCadastro && modalCadastro.classList.contains('aberto')) {
                    if (typeof fechaModalCadastro === 'function') fechaModalCadastro();
                }
            });
        });
    </script>
</body>

</html>
