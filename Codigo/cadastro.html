<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="Keywords" content="Loja geek, figures, Shadow Realm Store">
    <meta name="author" content="Shadow Realm">
    <title>Shadow Realm Store - Cadastro</title>
    <link rel="stylesheet" href="site.css">
    <script src="site.js"></script>
</head>

<body>
    <header>
        <a href="index.html"><img src="imagens/logo.png" class="logo"></a>
        <h1>- Shadow Realm Store -</h1>
        <div class="nav">
            <nav>
                <a href="index.html" class="link"><img src="imagens/Casinha-removebg-preview.png"></a>
                <a href="carrinho.html" class="link"><img src="imagens/carrinho-removebg-preview.png"></a>
                <a href="contato.html" class="link"><img src="imagens/contato.png"></a>
                <a href="produtos.html" class="link"><img src="imagens/produto.png"></a>
                <button type="button" class="botaoUsuario" onclick="abreModalCliente()"><img src="imagens/Usuario.png"></button>
            </nav>
        </div>
    </header>

    <div class="modalCliente" id="modalCliente">
        <div class="modalCliente-conteudo">
            <h2 style="font-size: 30px;">Usuário</h2>
            <nav class="nav-usuario">
                <a href="cadastro.html">cadastro</a>
                <a href="cliente.html">Login</a>
                <a href="cadastrocartao.html">Cadastrar cartão</a>
                <button type="button" onclick="fechaModalCliente()" class="botaoFecharCliente">Fechar</button>
            </nav>
        </div>
    </div>

    <h2 style="font-size: 35px; margin: 20px;">Cadastro</h2>

    <form name="frmcadastro" method="post" class="formLogin" action="#" onsubmit="return validaCadastro()">

        <!-- Grupo 1: Campos de informações pessoais -->
        <fieldset class="login">
            <div class="colunas">
                <label for="nome">Nome Completo: </label>
                <input type="text" name="txtnome" id="nome" class="" placeholder="Digite seu Nome Completo: ">

                <label for="email">Email: </label>
                <input type="email" name="txtemail" id="email" placeholder="Digite seu email:">
            </div>

            <div class="colunas">
                <label for="senha">Senha: </label>
                <input type="password" name="txtsenha" id="senha" placeholder="Digite sua Senha:">

                <label for="cpf">CPF: </label>
                <input type="text" name="txtcpf" id="cpf" maxlength="14" placeholder="000.000.000-00"
                    autocomplete="off">
            </div>

            <div class="colunasBotao">
                <button type="reset" onclick="verificaMotivo(null)">Limpar</button>
                <button type="submit">Enviar</button>
            </div>

        </fieldset>
    </form>

    <p class="cadastrar-se">Já tem Login? <a class="linklogin" href="cliente.html">Logar-se</a></p>

    <footer>
        &copy; Copyright. Shadow Realm Store 2026. Todos os direitos reservados.
    </footer>

    <!-- Janela Modal -->
    <div id="modalDadosCadastro" class="modal">
        <div class="modal-conteudo">
            <h2>Confira seus dados de Cadastro</h2>
            <ul id="listaDadosCadastro"></ul>
            <div class="modal-botoes">
                <button type="button" onclick="fechaModalCadastro()">Corrigir Cadastro</button>
                <button type="button" onclick="confirmaCadastro()">Confirmar cadastro</button>
            </div>
        </div>
    </div>
</body>

</html>
